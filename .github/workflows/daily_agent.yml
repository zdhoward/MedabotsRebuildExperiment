name: Daily AI Dev Session

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 14 * * *"   # 10:00 AM America/Toronto

concurrency:
  group: daily-agent
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Run agent session
        env:
          AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
