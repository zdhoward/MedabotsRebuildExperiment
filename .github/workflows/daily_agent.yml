# Daily autonomous session, driven by the Mistral "vibe" coding CLI
# (PyPI: mistral-vibe, https://github.com/mistralai/mistral-vibe).
#
# Requires repository secret AGENT_API_KEY (Mistral API key, console.mistral.ai).

name: Daily AI Dev Session

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * *"   # 10:00 AM America/Toronto

concurrency:
  group: daily-agent
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      - name: Install vibe CLI (validated recipe)
        run: |
          python -m pip install --disable-pip-version-check \
            "mistral-vibe==2.9.4" "mcp>=1.14.0,<2.0"
          vibe --version

      - name: Configure git identity for session commits
        run: |
          git config user.name "devbot"
          git config user.email "bot@users.noreply.github.com"

      # Budget caps are guards, not verdicts: if the agent hits one after
      # completing and pushing the session, the publish gate below decides
      # whether the output is publishable. A run is judged by its content.
      - name: Run agent session
        continue-on-error: true
        env:
          MISTRAL_API_KEY: ${{ secrets.AGENT_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          vibe -p "Execute one session per HANDOFF.md (your operating manual), AGENTS.md, and PROMPT.md: read STATE.json, implement the single active task, run tests, write the devlog post per the content rules, update STATE.json, and prepare a session branch. Do not touch ROADMAP.md." \
            --max-turns 80 \
            --max-price 12.00 \
            --trust \
            --output text \
            --workdir .

      - name: Discover pushed session branch
        id: session
        if: always()
        run: |
          git fetch --prune origin
          CUTOFF=$(( $(date +%s) - 2700 ))
          BR=$(git for-each-ref --sort=-committerdate --format='%(refname:short) %(committerdate:unix)' refs/remotes/origin/session/ | awk -v c="$CUTOFF" '$2 > c {print $1; exit}')
          if [ -n "$BR" ]; then
            echo "Agent pushed session branch: $BR"
            echo "branch=$BR" >> "$GITHUB_OUTPUT"
          else
            echo "No fresh session branch pushed; validating the workspace instead."
          fi

      - name: Publish gate (post + report + engine tests + blog build)
        if: always()
        run: |
          BR="${{ steps.session.outputs.branch }}"
          if [ -n "$BR" ]; then
            git worktree add "$RUNNER_TEMP/session-branch" "$BR"
            cd "$RUNNER_TEMP/session-branch"
            NEW_POSTS=$(git diff --name-only origin/main HEAD -- blog/src/content/blog/)
          elif [ -z "$(git status --porcelain)" ]; then
            echo "Agent pushed no branch and the workspace is clean; nothing was produced."
            exit 1
          else
            NEW_POSTS=$(git status --porcelain -- blog/src/content/blog/)
          fi
          [ -n "$NEW_POSTS" ] || { echo "Session content includes no new devlog post; session did not complete."; exit 1; }
          [ -f temp/session_report.json ] || { echo "No session report in the session content; agent produced nothing."; exit 1; }
          python scripts/validate_post.py
          python -m pip install -e "engine[dev]"
          (cd engine && pytest -q)
          (cd blog && npm ci --no-audit --no-fund && npm run build)

      - name: Open session PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BR="${{ steps.session.outputs.branch }}"
          if [ -n "$BR" ]; then
            BR_NAME="${BR#origin/}"
            if [ -n "$(gh pr list --head "$BR_NAME" --state open)" ]; then
              echo "PR already open for $BR_NAME; nothing to do."
              exit 0
            fi
            gh pr create --draft --title "Session $(date +%F)" \
              --body "Automated session run via daily_agent.yml. The daily run's publish gate must be green before merge." \
              --head "$BR_NAME"
            exit 0
          fi
          # Fallback: the agent left work uncommitted in the workspace.
          [ -f temp/session_report.json ] || { echo "No session report; skipping PR."; exit 0; }
          BR_NAME="session/$(date +%Y-%m-%d)-$(python -c 'import json;print(json.load(open("STATE.json"))["active_task_id"])')"
          git checkout -b "$BR_NAME" 2>/dev/null || git checkout "$BR_NAME"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes produced; skipping PR."
            exit 0
          fi
          git -c user.name="devbot" -c user.email="bot@users.noreply.github.com" \
            commit -m "session: $(date +%F)"
          git push origin "$BR_NAME"
          gh pr create --draft --title "Session $(date +%F)" \
            --body "Automated session run via daily_agent.yml. The daily run's publish gate must be green before merge." \
            --head "$BR_NAME"
