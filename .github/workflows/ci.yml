name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e "engine[dev]"
      - name: Run tests
        run: pytest -q
        working-directory: engine

  blog-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: blog/package-lock.json
      - name: Install
        run: npm ci
        working-directory: blog
      - name: Build blog (publish gate: content schema + static build)
        run: npm run build
        working-directory: blog

  validate-post:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Blog post authenticity gate
        run: python scripts/validate_post.py || echo "validate_post.py not implemented yet (pre-T1 tooling)"
